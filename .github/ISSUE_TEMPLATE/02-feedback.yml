name: Idea or documentation feedback
description: Suggest an improvement or point out something unclear in a guide.
body:
  - type: textarea
    id: feedback
    attributes:
      label: What could be better?
      description: Describe your idea or link to the guide passage that was unclear.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Share a possible solution or clearer wording, if you have one.
    validations:
      required: false
