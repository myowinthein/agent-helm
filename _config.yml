title: agent-helm
description: A workflow plugin for developers using Claude and Codex. Keep project context across sessions, refactor code, write tests, maintain docs, audit configuration, manage Git history, ship releases and archive projects.
url: "https://myowinthein.github.io"
baseurl: "/agent-helm"
remote_theme: just-the-docs/just-the-docs@latest
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
nav_sort: order
nav_external_links_new_tab: false
aux_links_new_tab: false
nav_external_links:
  - title: GitHub
    url: https://github.com/myowinthein/agent-helm
    hide_icon: false

footer_content: "agent-helm &mdash; MIT License"

plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache

# Every new top-level directory must be added here manually or Jekyll will include it in the site build.
exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - AGENTS.md
  - LICENSE
  - .gitignore
  - .DS_Store
  - .claude/
  - .claude-plugin/
  - rules/
  - prompts/
  - skills/
  - workflows/
  - helpers/
  - scripts/
  - Rakefile
