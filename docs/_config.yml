source: .
destination: _site

title: Agent Helm
tagline: Workflows for Claude and Codex
description: Workflows for Claude and Codex to keep project context, improve code and tests, maintain docs and publish reviewed changes.
url: "https://myowinthein.github.io"
baseurl: "/agent-helm"
remote_theme: just-the-docs/just-the-docs@latest
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image:
        path: /docs/images/banner.jpg
        width: 1200
        height: 800
        alt: A helmsman steering a ship toward a storm
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: "commands"
      type: pages
    values:
      title_category: Command guide
  - scope:
      path: "setup"
      type: pages
    values:
      title_category: Setup
  - scope:
      path: "rules"
      type: pages
    values:
      title_category: Rules
nav_sort: order
nav_external_links_new_tab: false
aux_links_new_tab: false
nav_external_links:
  - title: GitHub
    url: https://github.com/myowinthein/agent-helm
    hide_icon: false

plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-include-cache

# These files support authoring and checks rather than published pages.
exclude:
  - Gemfile
  - Gemfile.lock
  - documentation.md
  - scripts/
  - tests/
  - tasks.rb
