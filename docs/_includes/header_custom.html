<div class="theme-switcher" hidden>
  <label for="theme-mode">Theme</label>
  <select id="theme-mode" aria-describedby="theme-fallback">
    <option value="system">System</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <span id="theme-status" class="interaction-feedback theme-status" role="status"></span>
  <span id="theme-fallback" class="theme-fallback" hidden></span>
</div>
